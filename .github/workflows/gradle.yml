name: Build, Compile, and Upload Artifacts

on:
  push:
    branches: ['**']        # run on every branch
  pull_request:
    branches: ['**']        # run for PRs from any branch
  workflow_dispatch:         # manual trigger (optional)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Setup Gradle w/ caching for wrapper & dependencies (recommended by Gradle)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable (Unix)
        run: chmod +x ./gradlew

      - name: Build all modules
        run: ./gradlew build --no-daemon

      # Easiest and most reliable: upload every JAR under build/libs across modules
      - name: Upload all module JARs
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ github.ref_name }}
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
